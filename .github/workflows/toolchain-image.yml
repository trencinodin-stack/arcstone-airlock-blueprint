name: Build & Attest Verifier OCI Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push digest-pinned image to GHCR"
        required: true
        default: "true"
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push verifier image
        id: build
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}-verifier"
          docker build -f airlock/Containerfile -t "${IMAGE_NAME}:latest" .
          if [ "${{ inputs.push_image }}" = "true" ]; then
            docker push "${IMAGE_NAME}:latest"
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_NAME}:latest")"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Built and pushed digest-pinned verifier image: ${DIGEST}"
          fi

      - name: Attest OCI image provenance
        if: inputs.push_image == 'true'
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ghcr.io/${{ github.repository }}-verifier
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
